<div class="modal-backdrop" id="modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h2 id="modalTitle">Acción de demostración</h2><p>Esta pantalla es una primera maqueta visual. Antes de guardar movimientos reales, definiremos las reglas contables y conectaremos almacenamiento seguro.</p></div><button class="close-modal" id="closeX" aria-label="Cerrar">×</button></div><div class="modal-actions"><button class="outline-btn" id="closeModal">Entendido</button></div></div></div>
<input type="file" id="avatarFileGlobal" class="avatar-upload" accept="image/jpeg,image/png,image/webp" aria-label="Seleccionar foto de perfil">
<script>
  const pages={overview:{label:'Resumen',title:'Resumen financiero',desc:'Vista general del movimiento contable de GC Logis.'},transactions:{label:'Transacciones',title:'Transacciones',desc:'Consulta y organiza los movimientos de la empresa.'},receivables:{label:'Cuentas por cobrar',title:'Cuentas por cobrar',desc:'Seguimiento de facturas y saldos pendientes de clientes.'},payables:{label:'Cuentas por pagar',title:'Cuentas por pagar',desc:'Control de facturas y compromisos con proveedores.'},reports:{label:'Reportes',title:'Reportes contables',desc:'Revisa resultados por periodo y prepara tus reportes.'},settings:{label:'Configuración',title:'Configuración',desc:'Preferencias básicas del espacio de trabajo.'},users:{label:'Usuarios',title:'Usuarios',desc:'Administra el acceso al panel de GC Logis.'}};
  let current='overview'; const icon=(d)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="${d}"/></svg>`;
  function dashboard(){return `<div class="page-heading"><div><div class="eyebrow">PANEL CONTABLE</div><h1>Resumen financiero</h1><p class="subtitle">Una vista clara de las finanzas de GC Logis.</p></div><button class="primary-btn action-demo">${icon('M12 5v14M5 12h14')}<span class="btn-text">Nueva transacción</span></button></div>
    <div class="filters-row"><label class="date-filter">Periodo <select aria-label="Seleccionar periodo"><option>Este mes</option><option>Últimos 30 días</option><option>Este año</option></select></label></div>
    <section class="cards"><article class="card metric"><div class="metric-top"><span class="metric-label">Ingresos del periodo</span><span class="metric-icon">${icon('M12 3v18m7-7-7 7-7-7')}</span></div><div class="metric-value">RD$ 0.00</div></article><article class="card metric"><div class="metric-top"><span class="metric-label">Gastos del periodo</span><span class="metric-icon blue">${icon('M12 21V3m-7 7 7-7 7 7')}</span></div><div class="metric-value">RD$ 0.00</div></article><article class="card metric"><div class="metric-top"><span class="metric-label">Por cobrar</span><span class="metric-icon gray">${icon('M4 5h16v15H4zM8 9h8M8 13h5')}</span></div><div class="metric-value">RD$ 0.00</div></article><article class="card metric"><div class="metric-top"><span class="metric-label">Por pagar</span><span class="metric-icon gray">${icon('M4 5h16v15H4zM8 9h8M8 13h5')}</span></div><div class="metric-value">RD$ 0.00</div></article></section>
    <section class="grid-main"><article class="panel"><div class="panel-head"><div><h2 class="panel-title">Ingresos y gastos</h2><div class="panel-sub">Comparativo mensual · pesos dominicanos</div></div><select class="select-mini"><option>Últimos 6 meses</option><option>Este año</option></select></div><div class="chart-area"></div><div class="chart-legend"><span><i class="legend-dot"></i>Ingresos</span><span><i class="legend-dot navy"></i>Gastos</span></div></article><article class="panel"><div class="panel-head"><div><h2 class="panel-title">Movimientos recientes</h2><div class="panel-sub">Últimas transacciones ingresadas</div></div><button class="icon-btn" style="width:30px;height:30px" aria-label="Más opciones">···</button></div><div class="empty-note"><span class="empty-icon">${icon('M4 5h16v15H4zM8 9h8M8 13h5')}</span><b>Aún no hay movimientos</b></div></article></section>
    <section class="panel"><div class="panel-head"><div><h2 class="panel-title">Accesos rápidos</h2><div class="panel-sub">Acciones frecuentes del sistema</div></div></div><div class="quick-grid"><button class="quick action-demo"><span class="quick-symbol">＋</span><span><b>Registrar ingreso</b><small>Agregar un cobro o ingreso</small></span></button><button class="quick action-demo"><span class="quick-symbol">−</span><span><b>Registrar gasto</b><small>Agregar un pago o gasto</small></span></button><button class="quick" data-page="reports"><span class="quick-symbol">↗</span><span><b>Ver reportes</b><small>Consultar resumen por periodo</small></span></button></div></section>
    `}
  function listPage(key){const p=pages[key];if(key==='users'&&window.gcUsersPageHTML)return window.gcUsersPageHTML();let headers=key==='transactions'?['Fecha','Descripción','Categoría','Tipo','Importe','Estado']:key==='receivables'?['Cliente','Factura','Emisión','Vencimiento','Saldo','Estado']:key==='payables'?['Proveedor','Factura','Emisión','Vencimiento','Saldo','Estado']:key==='reports'?['Reporte','Periodo','Última actualización','Formato','']:['Preferencia','Detalle',''];return `<div class="page-heading"><div><div class="eyebrow">CONTABILIDAD</div><h1>${p.title}</h1><p class="subtitle">${p.desc}</p></div>${key==='settings'?'':`<button class="primary-btn action-demo">${icon('M12 5v14M5 12h14')}<span class="btn-text">${key==='reports'?'Crear reporte':'Añadir registro'}</span></button>`}</div><div class="filters-row"><label class="date-filter">Periodo <select><option>Este mes</option><option>Últimos 30 días</option><option>Este año</option></select></label></div><section class="panel section-panel"><div class="section-toolbar"><div><h2 class="panel-title">${key==='transactions'?'Todos los movimientos':key==='receivables'?'Facturas pendientes de cobro':key==='payables'?'Facturas pendientes de pago':key==='reports'?'Reportes disponibles':'Preferencias de la cuenta'}</h2></div><input class="search" placeholder="Buscar..." aria-label="Buscar"></div><div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody><tr><td class="table-empty" colspan="${headers.length}"><div class="empty-note"><span class="empty-icon">${icon('M4 5h16v15H4zM8 9h8M8 13h5')}</span><b>Todavía no hay registros</b></div></td></tr></tbody></table></div></section>`}
  let indicatorInitialized=false;
  function updateTabIndicator(animate=true){const active=document.querySelector('#primaryTabs .primary-tab.active');const indicator=document.getElementById('tabIndicator');if(!active||!indicator)return;const immediate=!indicatorInitialized||!animate;if(immediate)indicator.classList.add('no-motion');indicator.style.width=active.offsetWidth+'px';indicator.style.transform='translateX('+active.offsetLeft+'px)';if(immediate){indicator.offsetWidth;indicator.classList.remove('no-motion')}indicatorInitialized=true}
  function render(){const content=document.getElementById('pageContent');content.innerHTML=current==='overview'?dashboard():listPage(current);document.getElementById('crumbPage').textContent=pages[current].label;document.getElementById('primaryTabs').classList.toggle('is-hidden',current==='users'||current==='settings');document.querySelectorAll('[data-page]').forEach(el=>{const selected=el.dataset.page===current;el.classList.toggle('active',selected);el.setAttribute('aria-selected',String(selected))});updateTabIndicator();document.querySelectorAll('.action-demo').forEach(el=>el.addEventListener('click',()=>document.getElementById('modal').classList.add('open')))}
  const savedTheme=localStorage.getItem('gcl-theme');if(savedTheme==='dark')document.documentElement.dataset.theme='dark';document.getElementById('themeToggle').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';localStorage.setItem('gcl-theme',dark?'dark':'light')});document.getElementById('closeModal').onclick=document.getElementById('closeX').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')});document.addEventListener('click',e=>{const tab=e.target.closest('[data-page]');if(tab){current=tab.dataset.page;render();window.scrollTo({top:0,behavior:'smooth'})}});window.addEventListener('resize',()=>updateTabIndicator(false));render();if(document.fonts?.ready)document.fonts.ready.then(()=>updateTabIndicator(false));
</script>
